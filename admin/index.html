<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misterius Tools Admin</title><style>body{margin:0;background:#080808;color:#eee;font:14px Arial;padding:30px}.card{max-width:1000px;margin:auto;background:#111;border:1px solid #292929;border-radius:14px;padding:24px}input,button{padding:10px;border-radius:8px;border:1px solid #333;background:#090909;color:#fff}button{background:#e50914;border:0;cursor:pointer}.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:10px;border-bottom:1px solid #292929;text-align:left}small{color:#888}</style></head><body><div class="card"><h1>🔐 Misterius Tools Admin</h1><div class="row"><input id="api" placeholder="https://server-kamu.com" style="flex:1"><input id="admin" type="password" placeholder="Admin key" style="flex:1"><button onclick="loadDevices()">Refresh</button></div><div id="out"></div><hr><h3>Ganti Password License</h3><div class="row"><input id="newpass" type="password" placeholder="Password baru"><button onclick="changePass()">Simpan</button></div></div><script>const $=id=>document.getElementById(id);async function loadDevices(){const r=await fetch($('api').value+'/api/admin/devices',{headers:{'x-admin-key':$('admin').value}});const d=await r.json();if(!r.ok)return $('out').textContent=d.error;let h='<p>Total perangkat: <b>'+d.count+'</b></p><table><tr><th>Device</th><th>First Seen</th><th>Last Seen</th><th>Status</th><th>Aksi</th></tr>';d.devices.forEach(x=>h+=`<tr><td><code>${x.deviceId}</code><br><small>${(x.userAgent||'').slice(0,90)}</small></td><td>${x.firstSeen}</td><td>${x.lastSeen}</td><td>${x.active?'AKTIF':'NONAKTIF'}</td><td><button onclick="toggle('${x.deviceId}',${!x.active})">${x.active?'Nonaktifkan':'Aktifkan'}</button></td></tr>`);$('out').innerHTML=h+'</table>'}async function toggle(id,active){await fetch($('api').value+'/api/admin/device/'+encodeURIComponent(id)+'/toggle',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':$('admin').value},body:JSON.stringify({active})});loadDevices()}async function changePass(){const r=await fetch($('api').value+'/api/admin/password',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':$('admin').value},body:JSON.stringify({password:$('newpass').value})});alert(r.ok?'Password berhasil diganti':'Gagal mengganti password');}</script></body></html>
