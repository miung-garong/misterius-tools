<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vins License Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080808;
      color: #fff;
      padding: 30px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      color: #ff2020;
      margin-bottom: 5px;
    }

    h2 {
      color: #fff;
      margin-top: 30px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 30px;
    }

    .card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 7px;
      border: 1px solid #333;
      background: #080808;
      color: #fff;
      outline: none;
      margin-bottom: 12px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    button:hover {
      opacity: .85;
    }

    .login-btn {
      width: 100%;
      background: #e50909;
      color: white;
    }

    .logout-btn {
      background: #333;
      color: white;
      float: right;
    }

    .refresh-btn {
      background: #222;
      color: white;
    }

    .create-btn {
      background: #e50909;
      color: white;
    }

    .generate-btn {
      background: #333;
      color: white;
    }

    .activate {
      background: #16803a;
      color: white;
    }

    .deactivate {
      background: #b51212;
      color: white;
    }

    .delete {
      background: #444;
      color: white;
    }

    .license {
      border: 1px solid #292929;
      background: #0c0c0c;
      padding: 18px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .license-key {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 10px;
      word-break: break-all;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .active {
      background: #123d1d;
      color: #4dff75;
    }

    .revoked {
      background: #3d1212;
      color: #ff4d4d;
    }

    .info {
      color: #999;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .message {
      margin-top: 12px;
      font-size: 14px;
    }

    #panel {
      display: none;
    }

    .top {
      overflow: hidden;
      margin-bottom: 25px;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .stat {
      background: #111;
      border: 1px solid #292929;
      border-radius: 10px;
      padding: 15px 20px;
      min-width: 140px;
    }

    .stat-number {
      font-size: 25px;
      font-weight: bold;
    }

    .stat-label {
      color: #888;
      font-size: 12px;
      margin-top: 4px;
    }

    .online-number {
      color: #4dff75;
    }

    .offline-number {
      color: #ff4d4d;
    }

    .device-id {
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .small {
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div id="login">

    <h1>VINS LICENSE ADMIN</h1>

    <div class="subtitle">
      License Management Panel
    </div>

    <div class="card">

      <input
        type="password"
        id="adminToken"
        placeholder="Masukkan Admin Token"
      >

      <button
        class="login-btn"
        onclick="login()"
      >
        LOGIN ADMIN
      </button>

      <div
        id="loginMessage"
        class="message"
      ></div>

    </div>

  </div>


  <!-- ADMIN PANEL -->

  <div id="panel">

    <div class="top">

      <h1>VINS LICENSE ADMIN</h1>

      <button
        class="logout-btn"
        onclick="logout()"
      >
        LOGOUT
      </button>

      <div class="subtitle">
        Kelola license dan monitor perangkat
      </div>

    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <div
          id="licenseCount"
          class="stat-number"
        >
          0
        </div>

        <div class="stat-label">
          TOTAL LICENSE
        </div>
      </div>


      <div class="stat">
        <div
          id="onlineCount"
          class="stat-number online-number"
        >
          0
        </div>

        <div class="stat-label">
          DEVICE ONLINE
        </div>
      </div>


      <div class="stat">
        <div
          id="offlineCount"
          class="stat-number offline-number"
        >
          0
        </div>

        <div class="stat-label">
          DEVICE OFFLINE
        </div>
      </div>

    </div>


    <!-- CREATE LICENSE -->

    <div class="card">

      <h2 style="margin-top:0;">
        CREATE LICENSE
      </h2>

      <input
        id="newLicenseKey"
        type="text"
        placeholder="Kosongkan untuk Generate otomatis"
      >

      <button
        class="generate-btn"
        onclick="generateKey()"
      >
        🎲 GENERATE KEY
      </button>

      <button
        class="create-btn"
        onclick="createLicense()"
      >
        ➕ CREATE LICENSE
      </button>

      <div
        id="createMessage"
        class="message"
      ></div>

    </div>


    <!-- LICENSES -->

    <div class="card">

      <h2 style="margin-top:0;">
        LICENSES
      </h2>

      <button
        class="refresh-btn"
        onclick="loadLicenses()"
      >
        🔄 REFRESH LICENSE
      </button>

      <div id="licenses"></div>

    </div>


    <!-- DEVICES -->

    <div class="card">

      <h2 style="margin-top:0;">
        DEVICES
      </h2>

      <div
        id="devices"
      >
        Memuat perangkat...
      </div>

    </div>


    <div
      id="panelMessage"
      class="message"
    ></div>

  </div>

</div>


<script>

const API =
  "https://vins-license-api.alvinstamvans.workers.dev";

let adminToken = "";


/* =========================
   LOGIN
========================= */

async function login() {

  const token =
    document
      .getElementById("adminToken")
      .value
      .trim();

  if (!token) {

    document
      .getElementById("loginMessage")
      .textContent =
        "Admin Token wajib diisi.";

    return;
  }

  adminToken = token;

  try {

    const response =
      await fetch(
        `${API}/admin/licenses`,
        {
          headers: {
            "Authorization":
              `Bearer ${adminToken}`
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.message ||
        "Token salah."
      );

    }

    document
      .getElementById("login")
      .style.display =
        "none";

    document
      .getElementById("panel")
      .style.display =
        "block";

    loadLicenses();
    loadDevices();

  } catch (error) {

    adminToken = "";

    document
      .getElementById("loginMessage")
      .textContent =
        "❌ " + error.message;

  }

}


/* =========================
   GENERATE KEY
========================= */

function generateKey() {

  const random =
    crypto.randomUUID()
      .replace(/-/g, "")
      .substring(0, 16)
      .toUpperCase();

  const key =
    `VINS-${random}`;

  document
    .getElementById("newLicenseKey")
    .value =
      key;

}


/* =========================
   CREATE LICENSE
========================= */

async function createLicense() {

  const input =
    document
      .getElementById("newLicenseKey");

  let licenseKey =
    input.value.trim();


  const message =
    document
      .getElementById("createMessage");


  message.textContent =
    "Membuat license...";


  try {

    const response =
      await fetch(
        `${API}/admin/license/create`,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${adminToken}`

          },

          body:
            JSON.stringify({

              license_key:
                licenseKey || null

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Gagal membuat license."
      );

    }


    input.value = "";


    message.textContent =
      "✅ License berhasil dibuat: " +
      data.license_key;


    await loadLicenses();


  } catch (error) {

    message.textContent =
      "❌ " + error.message;

  }

}


/* =========================
   LOAD LICENSES
========================= */

async function loadLicenses() {

  const container =
    document.getElementById(
      "licenses"
    );

  container.innerHTML =
    "<p>Memuat license...</p>";


  try {

    const response =
      await fetch(
        `${API}/admin/licenses`,
        {

          headers: {

            "Authorization":
              `Bearer ${adminToken}`

          }

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Gagal mengambil license."
      );

    }


    container.innerHTML = "";


    const licenses =
      data.licenses || [];


    document
      .getElementById(
        "licenseCount"
      )
      .textContent =
        licenses.length;


    if (!licenses.length) {

      container.innerHTML =
        "<p>Belum ada license.</p>";

      return;

    }


    licenses.forEach(
      license => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "license";


        const active =
          license.status ===
          "active";


        div.innerHTML = `

          <div class="license-key">
            🔑 ${escapeHtml(
              license.license_key
            )}
          </div>

          <div class="status ${
            active
              ? "active"
              : "revoked"
          }">

            ${
              active
                ? "🟢 ACTIVE"
                : "🔴 REVOKED"
            }

          </div>

          <div class="info">

            Dibuat:
            ${escapeHtml(
              license.created_at ||
              "-"
            )}

            <br>

            Expired:
            ${escapeHtml(
              license.expires_at ||
              "Tidak ada"
            )}

            <br>

            Last Seen:
            ${escapeHtml(
              license.last_seen ||
              "-"
            )}

          </div>


          ${
            active

            ? `

              <button
                class="deactivate"
                onclick="changeStatus(
                  '${escapeJs(
                    license.license_key
                  )}',
                  'revoked'
                )"
              >
                🔴 MATIKAN
              </button>

            `

            : `

              <button
                class="activate"
                onclick="changeStatus(
                  '${escapeJs(
                    license.license_key
                  )}',
                  'active'
                )"
              >
                🟢 AKTIFKAN
              </button>

            `
          }


          <button
            class="delete"
            onclick="deleteLicense(
              '${escapeJs(
                license.license_key
              )}'
            )"
          >
            🗑️ HAPUS
          </button>

        `;


        container.appendChild(
          div
        );

      }
    );


  } catch (error) {

    container.innerHTML =
      `<p>❌ ${
        escapeHtml(
          error.message
        )
      }</p>`;

  }

}


/* =========================
   LOAD DEVICES
========================= */

async function loadDevices() {

  const container =
    document.getElementById(
      "devices"
    );


  try {

    const response =
      await fetch(
        `${API}/admin/devices`,
        {

          headers: {

            "Authorization":
              `Bearer ${adminToken}`

          },

          cache:
            "no-store"

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Gagal mengambil device."
      );

    }


    const devices =
      data.devices || [];


    const online =
      devices.filter(
        device =>
          device.status ===
          "online"
      ).length;


    const offline =
      devices.filter(
        device =>
          device.status ===
          "offline"
      ).length;


    document
      .getElementById(
        "onlineCount"
      )
      .textContent =
        online;


    document
      .getElementById(
        "offlineCount"
      )
      .textContent =
        offline;


    container.innerHTML = "";


    if (!devices.length) {

      container.innerHTML =
        "<p>Belum ada perangkat.</p>";

      return;

    }


    devices.forEach(
      device => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "license";


        const isOnline =
          device.status ===
          "online";


        div.innerHTML = `

          <div class="device-id">

            ${
              escapeHtml(
                device.device_id
                  .slice(0, 8)
                  .toUpperCase()
              )
            }

          </div>


          <div
            class="status ${
              isOnline
                ? "active"
                : "revoked"
            }"
          >

            ${
              isOnline
                ? "🟢 ONLINE"
                : "🔴 OFFLINE"
            }

          </div>


          <div class="info">

            License:
            ${escapeHtml(
              device.license_key
            )}

            <br>

            First Seen:
            ${escapeHtml(
              device.first_seen
            )}

            <br>

            Last Seen:
            ${escapeHtml(
              device.last_seen
            )}

          </div>


          <div class="small">

            ${
              isOnline
                ? "Device sedang menggunakan tools."
                : "Device sudah tidak mengirim heartbeat."
            }

          </div>

        `;


        container.appendChild(
          div
        );

      }
    );


  } catch (error) {

    container.innerHTML =
      `<p>❌ ${
        escapeHtml(
          error.message
        )
      }</p>`;

  }

}


/* =========================
   CHANGE STATUS
========================= */

async function changeStatus(
  licenseKey,
  status
) {

  const action =
    status === "active"
      ? "mengaktifkan"
      : "mematikan";


  if (
    !confirm(
      `Yakin ingin ${action} license ${licenseKey}?`
    )
  ) {

    return;

  }


  try {

    const response =
      await fetch(
        `${API}/admin/license/status`,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${adminToken}`

          },

          body:
            JSON.stringify({

              license_key:
                licenseKey,

              status:
                status

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Gagal mengubah status."
      );

    }


    document
      .getElementById(
        "panelMessage"
      )
      .textContent =
        "✅ " +
        data.message;


    await loadLicenses();


  } catch (error) {

    document
      .getElementById(
        "panelMessage"
      )
      .textContent =
        "❌ " +
        error.message;

  }

}


/* =========================
   DELETE LICENSE
========================= */

async function deleteLicense(
  licenseKey
) {

  if (
    !confirm(
      `Hapus license ${licenseKey}?\n\nSemua data device yang terkait license ini juga akan dihapus.`
    )
  ) {

    return;

  }


  try {

    const response =
      await fetch(
        `${API}/admin/license/delete`,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${adminToken}`

          },

          body:
            JSON.stringify({

              license_key:
                licenseKey

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Gagal menghapus license."
      );

    }


    document
      .getElementById(
        "panelMessage"
      )
      .textContent =
        "✅ " +
        data.message;


    await loadLicenses();
    await loadDevices();


  } catch (error) {

    document
      .getElementById(
        "panelMessage"
      )
      .textContent =
        "❌ " +
        error.message;

  }

}


/* =========================
   LOGOUT
========================= */

function logout() {

  adminToken = "";

  document
    .getElementById(
      "panel"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "login"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "adminToken"
    )
    .value = "";

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJs(value) {

  return String(value)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

}


/* =========================
   AUTO REFRESH
========================= */

setInterval(
  () => {

    if (!adminToken) {
      return;
    }

    loadDevices();

  },
  10000
);

</script>

</body>
</html>
