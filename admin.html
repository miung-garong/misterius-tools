<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vins License Admin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #080808;
  color: #fff;
  padding: 30px;
}

.container {
  max-width: 1100px;
  margin: auto;
}

h1 {
  color: #ff2020;
}

.card {
  background: #111;
  border: 1px solid #292929;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  background: #080808;
  color: white;
  border: 1px solid #333;
  border-radius: 7px;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 9px 14px;
  cursor: pointer;
  font-weight: bold;
}

.login-btn,
.create-btn {
  background: #e50909;
  color: white;
}

.login-btn:hover,
.create-btn:hover {
  background: #ff2020;
}

.refresh-btn {
  background: #222;
  color: white;
  margin-bottom: 15px;
}

.logout-btn {
  float: right;
  background: #333;
  color: white;
}

.license-box {
  background: #101010;
  border: 1px solid #292929;
  border-radius: 12px;
  margin-bottom: 20px;
  overflow: hidden;
}

.license-header {
  padding: 16px;
  border-bottom: 1px solid #292929;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.license-title {
  font-size: 17px;
  font-weight: bold;
}

.stats {
  color: #aaa;
  font-size: 13px;
}

.stats span {
  margin-left: 12px;
}

.device-head,
.device-row {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1.4fr;
  gap: 15px;
  padding: 14px 16px;
  align-items: center;
}

.device-head {
  color: #888;
  font-size: 12px;
  text-transform: uppercase;
}

.device-row {
  border-top: 1px solid #202020;
}

.device-name {
  font-weight: bold;
}

.device-id {
  color: #666;
  font-size: 11px;
  margin-top: 5px;
}

.rename-btn {
  background: #333;
  color: white;
  padding: 5px 8px;
  margin-left: 5px;
}

.online {
  color: #4dff75;
  font-weight: bold;
}

.offline {
  color: #ff4d4d;
  font-weight: bold;
}

.last-seen {
  color: #777;
  font-size: 11px;
  margin-top: 5px;
}

.on-btn {
  background: #16803a;
  color: white;
}

.off-btn {
  background: #b51212;
  color: white;
}

.delete-btn {
  background: #333;
  color: #ff5555;
  margin-left: 5px;
}

.message {
  margin-top: 12px;
  color: #aaa;
}

#panel {
  display: none;
}

@media (max-width: 700px) {

  .device-head {
    display: none;
  }

  .device-row {
    grid-template-columns: 1fr;
  }

}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="login">

<h1>VINS LICENSE ADMIN</h1>

<div class="card">

<input
type="password"
id="adminToken"
placeholder="Masukkan Admin Token"
>

<button
class="login-btn"
onclick="login()"
>
LOGIN ADMIN
</button>

<div id="loginMessage" class="message"></div>

</div>

</div>


<!-- PANEL -->

<div id="panel">

<button
class="logout-btn"
onclick="logout()"
>
LOGOUT
</button>

<h1>VINS LICENSE ADMIN</h1>


<!-- CREATE LICENSE -->

<div class="card">

<h3>➕ CREATE LICENSE</h3>

<input
id="newLicenseKey"
placeholder="License Key (kosong = generate otomatis)"
>

<button
class="create-btn"
onclick="createLicense()"
>
CREATE LICENSE
</button>

<div id="createMessage" class="message"></div>

</div>


<button
class="refresh-btn"
onclick="loadAll()"
>
🔄 REFRESH
</button>


<div id="licenses"></div>

<div id="panelMessage" class="message"></div>

</div>

</div>


<script>

const API =
"https://vins-license-api.alvinstamvans.workers.dev";

let adminToken = "";


/* =========================
LOGIN
========================= */

async function login() {

const token =
document.getElementById("adminToken").value.trim();

if (!token) {

document.getElementById("loginMessage").textContent =
"Admin Token wajib diisi.";

return;

}

adminToken = token;

try {

const response =
await fetch(
`${API}/admin/licenses`,
{
headers:{
"Authorization":
`Bearer ${adminToken}`
}
}
);

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.message || "Token salah."
);

}

document.getElementById("login").style.display =
"none";

document.getElementById("panel").style.display =
"block";

loadAll();

} catch(error) {

adminToken = "";

document.getElementById("loginMessage").textContent =
"❌ " + error.message;

}

}


/* =========================
LOAD EVERYTHING
========================= */

async function loadAll() {

await loadLicenses();

}


/* =========================
LOAD LICENSE
========================= */

async function loadLicenses() {

const container =
document.getElementById("licenses");

container.innerHTML =
"<p>Memuat license...</p>";

try {

const response =
await fetch(
`${API}/admin/licenses`,
{
headers:{
"Authorization":
`Bearer ${adminToken}`
}
}
);

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.message ||
"Gagal mengambil license."
);

}

container.innerHTML = "";

for (const license of data.licenses) {

await createLicenseCard(
license,
container
);

}

if (!data.licenses.length) {

container.innerHTML =
"<p>Belum ada license.</p>";

}

} catch(error) {

container.innerHTML =
`<p>❌ ${escapeHtml(error.message)}</p>`;

}

}


/* =========================
LICENSE CARD
========================= */

async function createLicenseCard(
license,
container
) {

const response =
await fetch(
`${API}/admin/devices`,
{
headers:{
"Authorization":
`Bearer ${adminToken}`
}
}
);

const data =
await response.json();

const devices =
(data.devices || [])
.filter(
device =>
Number(device.license_id) ===
Number(license.id)
);

const now = Date.now();

let onlineCount = 0;
let onCount = 0;
let offCount = 0;

devices.forEach(device => {

const last =
new Date(device.last_seen).getTime();

if (
now - last <= 90000
) {
onlineCount++;
}

if (
device.device_status === "active"
) {
onCount++;
} else {
offCount++;
}

});


const box =
document.createElement("div");

box.className =
"license-box";


box.innerHTML = `

<div class="license-header">

<div class="license-title">
🔑 ${escapeHtml(license.license_key)}
</div>

<div class="stats">

Device: <b>${devices.length}</b>

<span>
OFF: <b>${offCount}</b>
</span>

<span>
ON: <b>${onCount}</b>
</span>

</div>

</div>


<div class="device-head">

<div>NAMA DEVICE</div>
<div>STATUS</div>
<div>KONTROL</div>

</div>

`;


const list =
document.createElement("div");


devices.forEach(device => {

const row =
document.createElement("div");

row.className =
"device-row";


const lastSeen =
new Date(
device.last_seen
).getTime();


const online =
now - lastSeen <= 90000;


const name =
device.device_name ||
device.device_id.slice(0,8);


row.innerHTML = `

<div>

<div class="device-name">

${escapeHtml(name)}

<button
class="rename-btn"
onclick="renameDevice(
'${escapeJs(device.device_id)}',
'${escapeJs(name)}'
)"
>
✏️
</button>

</div>

<div class="device-id">

${escapeHtml(
device.device_id
)}

</div>

</div>


<div>

<div class="${
online
? "online"
: "offline"
}">

${
online
? "🟢 ONLINE"
: "🔴 OFFLINE"
}

</div>

<div class="last-seen">

Last Seen:
${escapeHtml(
device.last_seen
)}

</div>

</div>


<div>

<button
class="${
device.device_status === "active"
? "on-btn"
: "off-btn"
}"
onclick="toggleDevice(
'${escapeJs(device.device_id)}',
'${
device.device_status === "active"
? "off"
: "active"
}'
)"
>

${
device.device_status === "active"
? "🟢 ON"
: "🔴 OFF"
}

</button>


<button
class="delete-btn"
onclick="deleteDevice(
'${escapeJs(device.device_id)}'
)"
>
🗑️
</button>

</div>

`;

list.appendChild(row);

});


if (!devices.length) {

list.innerHTML =
`
<div style="padding:16px;color:#777">
Belum ada device untuk license ini.
</div>
`;

}


box.appendChild(list);

container.appendChild(box);

}


/* =========================
CREATE LICENSE
========================= */

async function createLicense() {

const key =
document
.getElementById("newLicenseKey")
.value
.trim();

try {

const response =
await fetch(
`${API}/admin/license/create`,
{

method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
`Bearer ${adminToken}`
},

body:JSON.stringify({

license_key:key

})

}
);

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.message ||
"Gagal membuat license."
);

}

document.getElementById(
"createMessage"
).textContent =
"✅ " +
data.license_key;

document.getElementById(
"newLicenseKey"
).value = "";

await loadLicenses();

} catch(error) {

document.getElementById(
"createMessage"
).textContent =
"❌ " +
error.message;

}

}


/* =========================
RENAME DEVICE
========================= */

async function renameDevice(
deviceId,
oldName
) {

const name =
prompt(
"Masukkan nama perangkat:",
oldName
);

if (
name === null
) return;

try {

const response =
await fetch(
`${API}/admin/device/rename`,
{

method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
`Bearer ${adminToken}`
},

body:JSON.stringify({

device_id:deviceId,

device_name:name.trim()

})

}
);

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.message ||
"Gagal mengubah nama."
);

}

await loadLicenses();

} catch(error) {

alert(
"❌ " +
error.message
);

}

}


/* =========================
ON / OFF DEVICE
========================= */

async function toggleDevice(
deviceId,
status
) {

const text =
status === "active"
? "mengaktifkan"
: "mematikan";

if (
!confirm(
`Yakin ingin ${text} device ini?`
)
) return;


try {

const response =
await fetch(
`${API}/admin/device/status`,
{

method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
`Bearer ${adminToken}`
},

body:JSON.stringify({

device_id:deviceId,

status:status

})

}
);

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.message ||
"Gagal mengubah status."
);

}

await loadLicenses();

} catch(error) {

alert(
"❌ " +
error.message
);

}

}


/* =========================
DELETE DEVICE
========================= */

async function deleteDevice(
deviceId
) {

if (
!confirm(
"Yakin ingin menghapus device ini?"
)
) return;


try {

const response =
await fetch(
`${API}/admin/device/delete`,
{

method:"POST",

headers:{
"Content-Type":
"application/json",

"Authorization":
`Bearer ${adminToken}`
},

body:JSON.stringify({

device_id:deviceId

})

}
);

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.message ||
"Gagal menghapus device."
);

}

await loadLicenses();

} catch(error) {

alert(
"❌ " +
error.message
);

}

}


/* =========================
LOGOUT
========================= */

function logout() {

adminToken = "";

document.getElementById(
"panel"
).style.display =
"none";

document.getElementById(
"login"
).style.display =
"block";

document.getElementById(
"adminToken"
).value = "";

}


/* =========================
SECURITY
========================= */

function escapeHtml(value) {

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeJs(value) {

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


/* =========================
AUTO REFRESH
========================= */

setInterval(() => {

if (adminToken) {

loadLicenses();

}

},10000);

</script>

</body>
</html>
